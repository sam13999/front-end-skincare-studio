<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EFE9E1">
<title>SkinView</title>
<style>
:root{
  --bg:#EFE9E1;
  --frame:#F6F2EC;
  --page:#FAF9F5;
  --terra:#A15C47;
}
html,body{
  margin:0;height:100%;background:var(--bg);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;cursor:none;
}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg)}
#frame{
  position:absolute;overflow:hidden;background:var(--frame);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 18px 50px rgba(90,55,40,.10),0 2px 8px rgba(90,55,40,.05);
  outline:1px solid rgba(161,92,71,.12);opacity:0;transition:opacity .4s ease;
}
#frame.ready{opacity:1}
.page{
  position:absolute;left:0;top:0;opacity:0;background:var(--page);
  box-shadow:0 10px 36px rgba(70,45,30,.13),0 1px 3px rgba(70,45,30,.08);
}
.page img{position:absolute;display:block;pointer-events:none}
.page img.base{left:0;top:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <div class="page" id="p1"><img class="base" alt="" src="https://raw.githubusercontent.com/sam13999/front-end-skincare-studio/main/src/assets/landing/report-2.jpg"></div>
  <div class="page" id="p2"><img class="base" alt="" src="https://raw.githubusercontent.com/sam13999/front-end-skincare-studio/main/src/assets/landing/report-3.jpg"></div>
  <div class="page" id="p3"><img class="base" alt="" src="https://raw.githubusercontent.com/sam13999/front-end-skincare-studio/main/src/assets/landing/report-4.jpg"></div>
  <div class="page" id="p5"><img class="base" alt="" src="https://raw.githubusercontent.com/sam13999/front-end-skincare-studio/main/src/assets/landing/report-6.jpg"></div>
</div></div>
<script>
(function(){
  var PW=594.96, PH=841.92;
  var T={
    obs:{x:39,y:285,w:364,h:83,v:'center',pad:.022,card:1},
    profil:{x:40,y:177,w:153,h:173,v:'center',card:1},
    objectif:{x:39,y:212,w:331,h:52,v:'center',pad:.022,card:1},
    prioA:{x:409,y:192,w:147,h:175,v:'top'},
    prioB:{x:409,y:376,w:147,h:176,v:'bottom'},
    produit:{x:130,y:194,w:419,h:152,v:'center',pad:.022,card:1}
  };

  var stage=document.getElementById('stage'),
      frame=document.getElementById('frame'),
      pages={1:el('p1'),2:el('p2'),3:el('p3'),5:el('p5')};
  function el(id){return document.getElementById(id)}

  var W,H,FW,FH,S0,M;
  function setFrame(fh){
    frame.style.height=fh+'px';
    frame.style.top=(M+(FH-fh)*.47)+'px';
    frame._fh=fh;
  }
  function layout(){
    var vw=window.innerWidth,vh=window.innerHeight;
    W=Math.min(vw,vh*9/16);H=W*16/9;
    stage.style.width=W+'px';stage.style.height=H+'px';
    var m=W*.024;
    FW=W-2*m;FH=H-2*m;M=m;
    frame.style.left=m+'px';frame.style.width=FW+'px';
    setFrame(FH);
    frame.style.borderRadius=(W*.026)+'px';
    S0=Math.min(FW*.86/PW,FH*.86/PH);
  }

  function full(){return{s:S0,l:(FW-PW*S0)/2,t:(FH-PH*S0)/2,fh:FH}}
  function focus(z){
    var pad=FW*(z.pad||.045);
    var s=Math.min((FW-2*pad)/z.w,(FH-2*pad)/z.h);
    var l=FW/2-(z.x+z.w/2)*s,t,fh=FH;
    if(z.card)fh=Math.min(FH,z.h*s+2*pad);
    if(z.v==='top')t=pad-z.y*s;
    else if(z.v==='bottom')t=fh-pad-(z.y+z.h)*s;
    else t=fh/2-(z.y+z.h/2)*s;
    return{s:s,l:l,t:t,fh:fh};
  }

  function apply(p,st){
    p.style.width=(PW*st.s)+'px';p.style.height=(PH*st.s)+'px';
    p.style.left=st.l+'px';p.style.top=st.t+'px';
    if(st.fh!=null&&p.style.opacity!=='0')setFrame(st.fh);
    p._st=st;
  }

  function bezier(x1,y1,x2,y2){
    function cx(t){return 3*x1*t*(1-t)*(1-t)+3*x2*t*t*(1-t)+t*t*t}
    function cy(t){return 3*y1*t*(1-t)*(1-t)+3*y2*t*t*(1-t)+t*t*t}
    return function(x){
      var lo=0,hi=1,t=x;
      for(var i=0;i<30;i++){t=(lo+hi)/2;if(cx(t)<x)lo=t;else hi=t}
      return cy(t);
    };
  }
  var EASE=bezier(.22,.61,.36,1);
  var EASE_IO=bezier(.45,0,.25,1);

  var gen=0;
  function tween(d,fn,ease,g){
    return new Promise(function(res){
      var t0=performance.now();
      function f(now){
        if(g!==gen)return;
        var k=Math.min(1,(now-t0)/(d*1000));
        fn((ease||EASE)(k));
        if(k<1)requestAnimationFrame(f);else res();
      }
      requestAnimationFrame(f);
    });
  }
  function wait(sec,g){return new Promise(function(res){setTimeout(function(){if(g===gen)res()},sec*1000)})}
  function move(p,to,d,g,ease){
    var a=p._st;
    return tween(d,function(k){
      apply(p,{s:a.s+(to.s-a.s)*k,l:a.l+(to.l-a.l)*k,t:a.t+(to.t-a.t)*k,fh:a.fh+(to.fh-a.fh)*k});
    },ease,g);
  }
  function swap(from,to,d,g){
    var f0=frame._fh,f=full();
    to.style.opacity=0;apply(to,f);
    to.style.zIndex=2;if(from)from.style.zIndex=1;
    return tween(d,function(k){
      var fh=f0+(FH-f0)*k;setFrame(fh);
      to.style.top=(f.t-(FH-fh)/2)+'px';
      if(from){from.style.top=(from._st.t+(fh-f0)/2)+'px';from.style.opacity=1-k}
      to.style.opacity=k;
    },EASE_IO,g);
  }

  var FULL_HOLD=.5,ZOOM=.55,HOLD=2.6,FADE=.35;

  async function run(g){
    Object.keys(pages).forEach(function(k){pages[k].style.opacity=0;apply(pages[k],full())});
    setFrame(FH);
    var cur=null;

    async function plan(pageKey,target,hold){
      var p=pages[pageKey];
      await swap(cur,p,FADE,g);cur=p;
      await wait(FULL_HOLD,g);
      await move(p,focus(target),ZOOM,g);
      await wait(hold,g);
    }

    while(g===gen){
      await plan(1,T.obs,HOLD);
      await plan(2,T.profil,HOLD);
      await plan(3,T.objectif,HOLD);

      await move(pages[3],full(),.5,g);
      await wait(FULL_HOLD,g);
      await move(pages[3],focus(T.prioA),ZOOM,g);
      await wait(1.5,g);
      await move(pages[3],focus(T.prioB),.8,g,EASE_IO);
      await wait(2.3,g);

      await plan(5,T.produit,3.2);

      await tween(FADE,function(k){cur.style.opacity=1-k},EASE_IO,g);
      cur=null;
      await wait(.4,g);
    }
  }

  function start(){gen++;layout();run(gen)}

  var imgs=Array.prototype.slice.call(document.images);
  Promise.all(imgs.map(function(i){
    if(i.decode)return i.decode().catch(function(){});
    return new Promise(function(res){if(i.complete)res();else{i.onload=res;i.onerror=res}});
  })).then(function(){
    frame.classList.add('ready');
    setTimeout(start,600);
  });

  document.addEventListener('pointerdown',function(e){e.preventDefault();start()});
  document.addEventListener('keydown',function(e){if(e.key===' '||e.key==='r'||e.key==='R')start()});
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(start,250)});
})();
</script>
</body>
</html>
