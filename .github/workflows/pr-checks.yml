name: Frontend PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: npm run build
